[package]
name = "voice-server"
version = "0.1.3"
edition = "2021"
authors = ["Nexum Team"]
description = "Self-hosted voice and chat server"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Web server and WebSocket
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# UUID generation
uuid = { version = "1.7", features = ["v4", "serde"] }

# Random generation
rand = "0.8"

# CLI utilities
dialoguer = "0.11"
clap = { version = "4.5", features = ["derive"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Image processing
image = "0.24"
webp = "0.2"
mime = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
