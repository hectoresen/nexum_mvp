[package]
name = "voice-client"
version = "0.1.0"
description = "Voice MVP Client"
authors = ["Voice MVP Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5.0"
open = "5.0"
anyhow = "1.0"
tracing = "0.1"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-shell = "2.0"
